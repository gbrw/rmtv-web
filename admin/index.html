<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RM Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f14">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RM Admin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="boot" id="boot">
    <img src="../icons/icon-192.png" alt="">
    <div class="spinner"></div>
    <p id="bootMsg">جاري التحميل…</p>
    <button class="btn btn-primary" id="bootRetry" hidden>إعادة المحاولة</button>
  </div>
  <script src="../boot.js"></script>
  <script nomodule>document.getElementById("bootMsg").textContent = "متصفحك قديم جداً. حدّث النظام أو استخدم أحدث إصدار من Chrome أو Safari.";</script>

  <!-- شاشة الدخول -->
  <section class="login" id="loginView" hidden>
    <div class="login-card">
      <img src="../icons/icon-192.png" alt="" width="72" height="72">
      <h1>لوحة تحكم RM TV</h1>
      <p class="muted">سجّل الدخول بحساب Google الخاص بالمدير</p>
      <p class="form-error" id="loginError" hidden></p>
      <button class="btn google-btn block" id="googleBtn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        الدخول باستخدام Google
      </button>
    </div>
  </section>

  <!-- حساب غير مصرّح له -->
  <section class="login" id="deniedView" hidden>
    <div class="login-card">
      <img src="../icons/icon-192.png" alt="" width="72" height="72">
      <h1>غير مصرّح</h1>
      <p class="muted">الحساب <strong id="deniedEmail" dir="ltr"></strong> ليس له صلاحية إدارة RM TV.</p>
      <button class="btn block" id="deniedLogout" type="button">الدخول بحساب آخر</button>
    </div>
  </section>

  <!-- اللوحة -->
  <div id="appView" hidden>
    <header class="topbar">
      <div class="container topbar-inner">
        <button class="icon-btn" id="backBtn" hidden aria-label="رجوع"></button>
        <a class="brand" href="#/">
          <img src="../icons/icon-192.png" alt="" width="36" height="36">
          <span>RM Admin</span>
        </a>
        <span class="spacer"></span>
        <button class="icon-btn" id="updateBtn" aria-label="تحديث النظام" title="تحديث النظام"></button>
        <button class="icon-btn" id="logoutBtn" aria-label="تسجيل الخروج" title="تسجيل الخروج"></button>
      </div>
    </header>

    <main class="container">
      <div class="page-head">
        <div>
          <h1 id="pageTitle">الباقات</h1>
          <p class="muted" id="pageSub"></p>
        </div>
        <button class="btn btn-primary" id="addBtn"></button>
      </div>
      <div class="search">
        <span id="searchIcon"></span>
        <input class="input" id="search" type="search" placeholder="بحث..." autocomplete="off">
      </div>
      <div id="list" aria-live="polite"></div>
    </main>
  </div>

  <!-- نموذج الباقة -->
  <dialog id="networkDialog">
    <form id="networkForm" method="dialog" novalidate>
      <div class="dialog-head"><h2 id="networkDialogTitle">باقة</h2><button class="icon-btn btn-ghost" type="button" data-close aria-label="إغلاق"></button></div>
      <div class="dialog-body">
        <div class="field"><label for="nName">الاسم *</label><input class="input" id="nName" required></div>
        <div class="field">
          <label for="nCategory">التصنيف</label>
          <input class="input" id="nCategory" list="categoryList" placeholder="رياضة">
          <datalist id="categoryList"><option value="رياضة"><option value="أخبار"><option value="أطفال"><option value="إسلامية"><option value="أفلام"><option value="منوعات"></datalist>
        </div>
        <div class="field">
          <label for="nLogo">رابط الشعار</label>
          <div class="logo-field"><input class="input" id="nLogo" type="url" dir="ltr" inputmode="url"><span class="logo-preview" id="nLogoPreview"></span></div>
        </div>
        <div class="row">
          <div class="field"><label for="nOrder">الترتيب</label><input class="input" id="nOrder" type="number" inputmode="numeric"></div>
          <div class="field"><label>مفعّلة</label><label class="switch"><input type="checkbox" id="nActive"><span></span></label></div>
        </div>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-primary" type="submit" id="nSave">حفظ</button>
        <button class="btn" type="button" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>

  <!-- نموذج القناة -->
  <dialog id="channelDialog">
    <form id="channelForm" method="dialog" novalidate>
      <div class="dialog-head"><h2 id="channelDialogTitle">قناة</h2><button class="icon-btn btn-ghost" type="button" data-close aria-label="إغلاق"></button></div>
      <div class="dialog-body">
        <div class="field"><label for="cName">الاسم *</label><input class="input" id="cName" required></div>
        <div class="field">
          <label for="cLogo">رابط الشعار</label>
          <div class="logo-field"><input class="input" id="cLogo" type="url" dir="ltr" inputmode="url"><span class="logo-preview" id="cLogoPreview"></span></div>
        </div>
        <div class="field"><label for="cUrl">رابط البث *</label><textarea class="input" id="cUrl" dir="ltr" rows="2" required></textarea></div>
        <div class="field">
          <label for="cType">نوع البث</label>
          <select class="input" id="cType">
            <option value="direct">رابط مباشر (m3u8/ts/mp4)</option>
            <option value="youtube">رابط يوتيوب</option>
          </select>
        </div>
        <div class="field">
          <label for="cWeb">الظهور في نسخة الويب</label>
          <select class="input" id="cWeb">
            <option value="auto">تلقائي (تظهر إذا كان الرابط https أو يوتيوب)</option>
            <option value="hide">إخفاء من الويب</option>
          </select>
        </div>
        <div class="field"><label for="cNetwork">الباقة</label><select class="input" id="cNetwork"></select></div>
        <div class="row">
          <div class="field"><label for="cOrder">الترتيب</label><input class="input" id="cOrder" type="number" inputmode="numeric"></div>
          <div class="field"><label>مفعّلة</label><label class="switch"><input type="checkbox" id="cActive"><span></span></label></div>
        </div>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-primary" type="submit" id="cSave">حفظ</button>
        <button class="btn" type="button" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>

  <!-- تحديث النظام -->
  <dialog id="updateDialog">
    <form id="updateForm" method="dialog" novalidate>
      <div class="dialog-head"><h2>تحديث النظام</h2><button class="icon-btn btn-ghost" type="button" data-close aria-label="إغلاق"></button></div>
      <div class="dialog-body">
        <p class="muted" style="margin-top:0">يظهر إشعار التحديث لمستخدمي تطبيق أندرويد عند رفع رقم الإصدار.</p>
        <div class="field"><label for="uVersion">رقم الإصدار (Version Code) *</label><input class="input" id="uVersion" type="number" inputmode="numeric" dir="ltr" required></div>
        <div class="field"><label for="uUrl">رابط التحديث (ميديا فاير أو مباشر) *</label><input class="input" id="uUrl" type="url" dir="ltr" inputmode="url" required></div>
        <label class="check"><input type="checkbox" id="uForce"> إجبار المستخدمين على التحديث</label>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-primary" type="submit" id="uSave">نشر التحديث</button>
        <button class="btn" type="button" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>

  <!-- تأكيد -->
  <dialog id="confirmDialog">
    <form method="dialog">
      <div class="dialog-body"><p id="confirmText" style="margin:0;font-size:17px"></p></div>
      <div class="dialog-foot">
        <button class="btn btn-danger" value="yes">حذف</button>
        <button class="btn" value="no">إلغاء</button>
      </div>
    </form>
  </dialog>

  <div class="install-banner" id="installBanner" hidden>
    <img src="../icons/icon-192.png" alt="">
    <div style="flex:1">
      <strong>ثبّت لوحة التحكم</strong>
      <p id="installText">افتحها كتطبيق من الشاشة الرئيسية</p>
    </div>
    <button class="btn btn-primary" id="installBtn">تثبيت</button>
    <button class="icon-btn btn-ghost" id="installClose" aria-label="إغلاق"></button>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
